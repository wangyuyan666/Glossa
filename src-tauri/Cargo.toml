[package]
name = "glossa"
version = "0.1.0"
description = "LLM-powered English learning assistant with cross-app word lookup"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glossa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# bin target 名字必须大写。`tauri dev` 跑的是裸二进制而不是 .app bundle，没有 Info.plist
# 可读，macOS 就拿 argv[0] 当应用名——Dock 悬停和菜单栏都会显示成小写的包名。
# Cargo 包名不能大写，所以在这儿单独指定，同时 path 也要显式写（默认探测只认包名同名的 bin）。
[[bin]]
name = "Glossa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 本地 HTTP 端口和常驻窗口都要求单实例；否则第二个 dev 进程端口失败但窗口仍会打开，
# 两套一模一样的窗口会让行为与日志对不上。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "2"
# process / io-util / time 是给 speech.rs 用的：朗读走 `say` 子进程，文本从 stdin 灌，
# 再轮询它有没有念完。
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "process",
  "io-util",
  "time",
] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
futures-util = "0.3"
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
# 0.40 的 libsqlite3-sys 用了 cfg_select!，要求 Rust 1.91+。锁在能用 1.89 编的版本。
rusqlite = { version = "0.32", features = ["bundled"] }

# 只为 first_mouse.rs：绕过 WKWebView 吞掉首次点击的上游 bug，见该模块的注释。
# 版本跟 tao/wry 已经在用的对齐，别让依赖树里出现两个 objc2。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
