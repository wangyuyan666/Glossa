name: Build macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>"; exit 1 ;;
          esac
          VERSION="$version" node <<'EOF'
          const fs = require('fs');
          const v = process.env.VERSION;
          for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(f, 'utf8'));
            json.version = v;
            fs.writeFileSync(f, JSON.stringify(json, null, 2) + '\n');
          }
          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const patched = cargo.replace(/(\[package\][\s\S]*?\nversion\s*=\s*)"[^"]*"/, `$1"${v}"`);
          if (patched === cargo) throw new Error('failed to patch version in ' + cargoPath);
          fs.writeFileSync(cargoPath, patched);
          console.log('synced version to ' + v);
          EOF

      - name: Build app bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles dmg

      - name: Rename DMG with architecture suffix
        id: dmg
        run: |
          set -euo pipefail
          src=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -n1)
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="Glossa_${version}_${{ matrix.arch }}.dmg"
          mv "$src" "$(dirname "$src")/$out"
          echo "path=$(dirname "$src")/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: ${{ steps.dmg.outputs.path }}
          body: |
            Unsigned build. First launch: right-click the app → **Open** → **Open** to bypass Gatekeeper.
